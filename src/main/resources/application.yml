spring:
  application:
    name: ito1
  datasource:
    url: jdbc:postgresql://localhost:5432/geoiot
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        spatial:
          connection_finder: com.example.geoIot.util.CustomSpatialConnection
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

#  cache:
#    type: redis
#    redis:
#      host: localhost
#      port: 6379

server:
  error:
    include-message: always
